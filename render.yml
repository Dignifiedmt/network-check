# Render Blueprint (Infrastructure as Code) for NetworkCheck Nigeria
# 100% Free Tier ($0/month - Zero Credit Card or Payment Method Required)
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # NetworkCheck Full-Stack Application (React Frontend + Express Backend + USSD/SMS Engine)
  - type: web
    name: networkcheck
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      # Africa's Talking Sandbox Telecom Credentials (Pre-configured)
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AT_USERNAME
        value: sandbox
      - key: AFRICASTALKING_API_KEY
        value: atsk_8c2c1c9359de445a9184056ebcdd84bb415f010d44bc1259ac72cbb8b3393cedec034dc8
      - key: AT_API_KEY
        value: atsk_8c2c1c9359de445a9184056ebcdd84bb415f010d44bc1259ac72cbb8b3393cedec034dc8
      - key: AT_USSD_SERVICE_CODE
        value: "*384*20220#"
      - key: AT_SMS_SHORT_CODE
        value: "22220"
      - key: AFRICASTALKING_SENDER_ID
        value: NetworkChk
      - key: AT_SENDER_ID
        value: NetworkChk
      # Default Administrator Credentials
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@networkcheck.ng
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin_secure_password_2026
      # Cryptographic security salts generated automatically at zero cost
      - key: JWT_SECRET
        generateValue: true
      - key: NDPR_SALT
        generateValue: true
