# Render Blueprint (Infrastructure as Code) for NetworkCheck Nigeria
# 100% Completely Free Tier ($0/month - No credit card required)
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # NetworkCheck Full-Stack Application (React Frontend + Express Backend + USSD/SMS Engine)
  - type: web
    name: networkcheck
    runtime: node
    plan: free # 100% Free Tier ($0 / month)
    region: frankfurt # Low-latency region for Nigerian and European traffic
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "true"
      # Africa's Talking Telecom Credentials
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AT_USERNAME
        value: sandbox
      - key: AFRICASTALKING_API_KEY
        value: atsk_8c2c1c9359de445a9184056ebcdd84bb415f010d44bc1259ac72cbb8b3393cedec034dc8
      - key: AT_API_KEY
        value: atsk_8c2c1c9359de445a9184056ebcdd84bb415f010d44bc1259ac72cbb8b3393cedec034dc8
      - key: AT_USSD_SERVICE_CODE
        value: "*384*20220#"
      - key: AT_SMS_SHORT_CODE
        value: "22220"
      - key: AFRICASTALKING_SENDER_ID
        value: NetworkChk
      - key: AT_SENDER_ID
        value: NetworkChk
      # Google Gemini API Key for Multilingual NLP (Optional)
      - key: GEMINI_API_KEY
        sync: false
      # Administrator Credentials & Security
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@networkcheck.ng
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin_secure_password_2026
      # Security Keys (Auto-generated on Render at zero cost)
      - key: JWT_SECRET
        generateValue: true
      - key: NDPR_SALT
        generateValue: true
      # Optional external database URL (e.g. Supabase, Neon) - In-memory store powers the app for free if unset
      - key: DATABASE_URL
        sync: false

